[package]
name = "ielts-pilot"
version = "0.5.0"
description = "A local-first IELTS reading practice studio"
authors = ["XiaoZheBrother"]
edition = "2021"

[lib]
name = "ielts_pilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
