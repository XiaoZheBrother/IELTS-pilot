name: Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Verify web application
        run: npm run check
      - name: Prepare optional Windows signing configuration
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $configuration = @{}
          if ($env:WINDOWS_CERTIFICATE) {
            $certificatePath = Join-Path $env:RUNNER_TEMP 'ielts-pilot-signing.pfx'
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
            $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
            $configuration = @{
              bundle = @{
                windows = @{
                  certificateThumbprint = $certificate.Thumbprint
                  digestAlgorithm = 'sha256'
                  timestampUrl = 'http://timestamp.digicert.com'
                }
              }
            }
          }
          $configuration | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 src-tauri/tauri.ci-signing.conf.json
      - name: Build and publish installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: IELTS Pilot v__VERSION__
          releaseBody: Windows NSIS installer with signed in-app updater metadata. Download the Setup.exe asset to install IELTS Pilot.
          releaseDraft: false
          prerelease: false
          releaseAssetNamePattern: IELTS-Pilot-[version]-Windows-[arch]-Setup.[ext]
          updaterJsonPreferNsis: true
          args: --bundles nsis --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.ci-signing.conf.json
